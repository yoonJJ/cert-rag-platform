# 운영 배포용 compose - DB/Redis + 앱(server/client) 전체
# 비밀값은 같은 디렉터리의 .env 파일에서 주입됩니다 (.env.prod.example 참고).
# platform 핀을 제거해 배포 서버(amd64 등) 아키텍처로 네이티브 빌드됩니다.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certdb}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-certdb}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  server:
    # FastAPI 백엔드 (기존 Express 버전은 ./server 에 보관)
    build: ./server-py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-certdb}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3001
      # 채팅: 아래 중 선택한 provider 키. 임베딩(RAG)에는 OPENAI_API_KEY 필요.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-openai/gpt-4o-mini}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-768}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
